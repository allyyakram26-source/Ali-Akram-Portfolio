<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080D" />
    <meta name="google-site-verification" content="KzJ7c1R9r0kjA_Dw09znEjUegh6Jm2c1f8QDf5y3_C4" />
    <meta
      name="description"
      content="Ali Akram - React Native Developer portfolio"
    />
    <title>Ali Akram | React Native Developer</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ali-portfolio-theme');
          var isDark = theme ? theme === 'dark' : true;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
